name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Deploys the Go backend as a Cloudflare Container (see wrangler.jsonc,
  # src/worker.ts). Only on a real push to main, not PRs — a PR from a
  # fork wouldn't have access to the deploy secrets anyway, and we don't
  # want every PR touching production.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Catches a bad deploy immediately rather than silently — the same
      # checks `make smoke` runs locally, pointed at the real production
      # URLs instead of localhost. A short sleep first: a Container that
      # was asleep (see wrangler.jsonc's sleepAfter) takes a moment to
      # spin back up on its first request after a redeploy.
      - run: sleep 5 && ./scripts/smoke-test.sh
        env:
          BACKEND_URL: https://api.brass-ledger.app
          FRONTEND_URL: https://brass-ledger.app
