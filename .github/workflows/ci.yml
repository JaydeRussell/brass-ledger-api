name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # See .golangci.yml — errcheck's default strictness on a deferred
      # Close/Rollback is excluded there rather than annotated at every
      # call site; everything else runs at golangci-lint's defaults.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      # Flags known-vulnerable dependencies actually reachable from this
      # module's own code (not just present in go.sum) — see the
      # 2026-09-12 dependency bump commit for what this caught the first
      # time it ran here (a real, reachable SQL-injection CVE in pgx,
      # among others). Not gated to a specific severity: govulncheck only
      # reports symbol-reachable vulnerabilities in the first place, so
      # there's no lower-severity noise to filter the way npm audit needs.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # internal/user (the Postgres-backed user/session store) has no
  # coverage in the `test` job above — there's no meaningful way to fake
  # a real upsert/constraint/transaction the way internal/api's routes
  # are tested against an in-memory fake — so it needs an actual
  # Postgres. Kept as its own job (rather than folded into `test`) so a
  # contributor without Docker/Postgres locally still gets fast,
  # dependency-free feedback from `go test ./...` on everything else.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brassledger
          POSTGRES_PASSWORD: brassledger
          POSTGRES_DB: brass_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -tags=integration ./internal/user/...
        env:
          DATABASE_URL: postgres://brassledger:brassledger@localhost:5432/brass_ledger?sslmode=disable

  # Deploys the Go backend as a Cloudflare Container (see wrangler.jsonc,
  # src/worker.ts). Only on a real push to main, not PRs — a PR from a
  # fork wouldn't have access to the deploy secrets anyway, and we don't
  # want every PR touching production.
  deploy:
    needs: [test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Catches a bad deploy immediately rather than silently — the same
      # checks `make smoke` runs locally, pointed at the real production
      # URLs instead of localhost. No fixed sleep here (a Container that
      # was asleep — see wrangler.jsonc's sleepAfter — could take longer
      # than any single guessed delay to spin back up): smoke-test.sh's
      # own check() now retries each URL with a backoff instead, so a
      # slow-to-wake container still passes once it actually answers,
      # rather than a one-shot request racing the cold start.
      - run: ./scripts/smoke-test.sh
        env:
          BACKEND_URL: https://api.brass-ledger.app
          FRONTEND_URL: https://brass-ledger.app
