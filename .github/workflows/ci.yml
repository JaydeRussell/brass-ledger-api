name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # contents: write is only actually exercised by the "Commit coverage
    # badge" step below, and only on a push to main — needed so that step
    # can push using the default GITHUB_TOKEN. A push made with that
    # token doesn't itself trigger another workflow run, so this can't
    # loop.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -coverprofile=coverage.out
      # See .golangci.yml — errcheck's default strictness on a deferred
      # Close/Rollback is excluded there rather than annotated at every
      # call site; everything else runs at golangci-lint's defaults.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      # Flags known-vulnerable dependencies actually reachable from this
      # module's own code (not just present in go.sum) — see the
      # 2026-09-12 dependency bump commit for what this caught the first
      # time it ran here (a real, reachable SQL-injection CVE in pgx,
      # among others). Not gated to a specific severity: govulncheck only
      # reports symbol-reachable vulnerabilities in the first place, so
      # there's no lower-severity noise to filter the way npm audit needs.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # Self-hosted coverage badge — no external service/account (unlike
      # Codecov) needed. Reads coverage.out from the plain `go test`
      # above (internal/user's own coverage lives in the Postgres-gated
      # `integration` job below and isn't included here — merging
      # profiles across the two runs isn't worth the added complexity for
      # a badge). Writes a shields.io "endpoint" JSON file, committed back
      # to main only (never on a PR, both because a fork's PR can't push
      # here and because only main's own number should be "the" badge).
      # README badges point at this file via shields.io's endpoint format:
      # https://img.shields.io/endpoint?url=<raw file URL>
      - name: Compute coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        # A hiccup in badge generation is a cosmetic problem, not a
        # reason to fail this job (and block the deploy gated on it).
        continue-on-error: true
        run: |
          set -euo pipefail
          pct="$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')"
          color="red"
          awk_ge() { awk -v a="$1" -v b="$2" 'BEGIN{exit !(a>=b)}'; }
          if awk_ge "$pct" 90; then color="brightgreen"
          elif awk_ge "$pct" 80; then color="green"
          elif awk_ge "$pct" 70; then color="yellowgreen"
          elif awk_ge "$pct" 60; then color="yellow"
          elif awk_ge "$pct" 50; then color="orange"
          fi
          mkdir -p .github/badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > .github/badges/coverage.json
      - name: Commit coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        run: |
          set -euo pipefail
          git add .github/badges/coverage.json
          # --cached (staged vs. HEAD), not a plain `git diff`, which
          # silently ignores untracked files entirely — that bug is
          # exactly why this never committed the badge's first run: the
          # file was brand new, so a plain `git diff --quiet` reported
          # "no changes" and skipped straight past the commit below.
          if git diff --cached --quiet -- .github/badges/coverage.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update coverage badge [skip ci]"
          git push

  # internal/user (the Postgres-backed user/session store) has no
  # coverage in the `test` job above — there's no meaningful way to fake
  # a real upsert/constraint/transaction the way internal/api's routes
  # are tested against an in-memory fake — so it needs an actual
  # Postgres. Kept as its own job (rather than folded into `test`) so a
  # contributor without Docker/Postgres locally still gets fast,
  # dependency-free feedback from `go test ./...` on everything else.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brassledger
          POSTGRES_PASSWORD: brassledger
          POSTGRES_DB: brass_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -tags=integration ./internal/user/...
        env:
          DATABASE_URL: postgres://brassledger:brassledger@localhost:5432/brass_ledger?sslmode=disable

  # Deploys the Go backend as a Cloudflare Container (see wrangler.jsonc,
  # src/worker.ts). Only on a real push to main, not PRs — a PR from a
  # fork wouldn't have access to the deploy secrets anyway, and we don't
  # want every PR touching production.
  deploy:
    needs: [test, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Catches a bad deploy immediately rather than silently — the same
      # checks `make smoke` runs locally, pointed at the real production
      # URLs instead of localhost. No fixed sleep here (a Container that
      # was asleep — see wrangler.jsonc's sleepAfter — could take longer
      # than any single guessed delay to spin back up): smoke-test.sh's
      # own check() now retries each URL with a backoff instead, so a
      # slow-to-wake container still passes once it actually answers,
      # rather than a one-shot request racing the cold start.
      - run: ./scripts/smoke-test.sh
        env:
          BACKEND_URL: https://api.brass-ledger.app
          FRONTEND_URL: https://brass-ledger.app
